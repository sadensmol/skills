display_information:
  name: autopilot
  description: Turns an owner's request into a reviewed pull request
features:
  bot_user: {display_name: autopilot, always_online: true}
oauth_config:
  scopes:
    bot: [chat:write, reactions:write, channels:history, groups:history, channels:read, groups:read]
settings:
  event_subscriptions:
    bot_events: [message.channels, message.groups]
  interactivity: {is_enabled: true}
  socket_mode_enabled: true
